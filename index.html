<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Earthscape Phase-1 Dashboard</title>
  <!-- Pulls in Tailwind for easy, colorful styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pulls in Chart.js for the graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 p-4 md:p-8 font-sans">

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Header -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h1 class="text-2xl md:text-3xl font-bold text-slate-800" id="projectName">Loading...</h1>
      <p class="text-slate-600 mt-1" id="projectDetails"></p>
      <span class="inline-block mt-3 bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-bold" id="updateBadge"></span>
    </div>

    <!-- Charts Row -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Escrow Chart -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-700 mb-4">Escrow Account Health</h2>
        <canvas id="escrowChart" height="200"></canvas>
      </div>
      <!-- Sales Chart -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-700 mb-4">Sales & Inventory</h2>
        <canvas id="salesChart" height="200"></canvas>
      </div>
    </div>

    <!-- Risk Matrix -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold text-slate-700 mb-4">NOC & Legal Approvals</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="riskMatrixContainer">
        <!-- Badges will be injected here by JavaScript -->
      </div>
    </div>
  </div>

  <!-- Connects your custom logic -->
  <script src="app.js"></script>
</body>
</html>
